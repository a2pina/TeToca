spring.application.name=backendTeToca

# Conexión a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/pisocompartido
spring.datasource.username=user
spring.datasource.password=user1234

# Hibernate comprueba que las tablas coinciden con las entidades, pero no las crea
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Las tablas las crea Flyway con los scripts de esta carpeta
spring.flyway.locations=classpath:db/migration